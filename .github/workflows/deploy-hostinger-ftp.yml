# Build Next.js on GitHub, then upload the cPanel pack to Hostinger.
#
# Secrets and variables live on the GitHub Environment named "Production"
# (Settings → Environments → Production), not repository secrets.
#
# Required environment secrets:
#   FTP_SERVER       Numeric FTP IP from hPanel → Files → FTP Accounts.
#                    Hostinger shows "ftp.yourdomain.in" but that name often
#                    has no DNS record. Prefer the IP, e.g. 148.x.x.x
#   FTP_USERNAME     FTP user from hPanel
#   FTP_PASSWORD     FTP password
#   FTP_SERVER_DIR   Remote folder, with trailing slash.
#                    If FTP lands in the account home: ./repositories/srkcrackers/
#                    If the FTP user is already jailed to the app folder: ./
#
# Optional:
#   FTP_IP           Fallback IP if FTP_SERVER is a hostname that does not resolve
#   FTP_PROTOCOL     ftps (default, explicit AUTH TLS on port 21) or ftp
#   FTP_PORT         21
#
# After upload, tmp/restart.txt tells Passenger / Setup Node.js App to reload.
# Do not upload .env files; keep MySQL + Auth in cPanel → Setup Node.js App.

name: Build and deploy to Hostinger FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build cPanel standalone pack
        env:
          NODE_ENV: production
          AUTH_TRUST_HOST: "true"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || vars.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || vars.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          if [ -z "$AUTH_SECRET" ] && [ -z "$NEXTAUTH_SECRET" ]; then
            export AUTH_SECRET="github-actions-build-placeholder"
            export NEXTAUTH_SECRET="$AUTH_SECRET"
            echo "AUTH_SECRET not set; using a build-only placeholder (set it in cPanel for runtime)."
          fi
          if [ -z "$DATABASE_URL" ]; then
            unset DATABASE_URL
            export DATABASE_URL="mysql://build:build@127.0.0.1:3306/build"
            echo "No DATABASE_URL; using a placeholder for Prisma generate/build."
            echo "Set MYSQL DATABASE_URL in cPanel for the live catalog."
          fi
          npm run build:cpanel

      - name: Stage production build files
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/.next deploy/tmp
          cp server.js deploy/server.js
          cp package.json deploy/package.json
          cp -a .next/standalone deploy/.next/standalone
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

          test -f deploy/server.js
          test -f deploy/.next/standalone/server.js
          echo "Staged:"
          du -sh deploy
          tar -czf pack.tar.gz -C deploy .
          ls -lh pack.tar.gz

      - name: Check and normalize FTP host
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_IP: ${{ secrets.FTP_IP || vars.FTP_IP }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add these on GitHub → Settings → Environments → Production."
            exit 1
          fi

          strip() {
            printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]\"'\'']*//' -e 's/[[:space:]\"'\'']*$//'
          }

          host="$(strip "$FTP_SERVER")"
          fallback_ip="$(strip "${FTP_IP:-}")"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host#http://}"
          host="${host#https://}"
          case "$host" in
            *@*) host="${host##*@}" ;;
          esac
          host="${host%%/*}"
          port="$FTP_PORT"
          if [[ "$host" == *:[0-9]* ]]; then
            port="${host##*:}"
            host="${host%:*}"
            echo "FTP_SERVER included a port; using $port"
          fi

          if [ -z "$host" ] || [[ "$host" == .* ]] || [[ "$host" == *\\* ]]; then
            echo "FTP_SERVER looks like a folder path, not a hostname."
            echo "Set it to the FTP IP from hPanel → Files → FTP Accounts (digits only)."
            exit 1
          fi

          resolve_ipv4() {
            local name="$1"
            local ip=""
            ip="$(getent ahostsv4 "$name" 2>/dev/null | awk '{print $1; exit}' || true)"
            if [ -z "$ip" ]; then
              ip="$(dig +short A "$name" @8.8.8.8 2>/dev/null | awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ {print; exit}' || true)"
            fi
            if [ -z "$ip" ]; then
              ip="$(
                H="$name" python3 -c 'import os, socket; print(socket.getaddrinfo(os.environ["H"], None, socket.AF_INET)[0][4][0])' 2>/dev/null || true
              )"
            fi
            printf '%s' "$ip"
          }

          db_host="$(
            python3 -c 'import os, urllib.parse; print(urllib.parse.urlparse(os.environ.get("DATABASE_URL") or "").hostname or "")' 2>/dev/null || true
          )"
          if [ -z "$db_host" ] || [[ "$db_host" == "localhost" ]] || [[ "$db_host" == "127.0.0.1" ]] || [[ "$db_host" == *turso* ]]; then
            db_host=""
          fi

          target="$host"
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FTP host kind: IP"
          else
            echo "FTP host kind: hostname (length ${#host})"
            resolved="$(resolve_ipv4 "$host")"
            if [ -n "$resolved" ]; then
              echo "Resolved FTP_SERVER to an IPv4 address"
              target="$resolved"
            elif [ -n "$fallback_ip" ] && [[ "$fallback_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "FTP_SERVER has no DNS record; using FTP_IP"
              target="$fallback_ip"
            elif [ -n "$db_host" ]; then
              db_ip="$(resolve_ipv4 "$db_host")"
              if [ -n "$db_ip" ]; then
                echo "FTP_SERVER has no DNS record; using Hostinger DB host IP"
                target="$db_ip"
              fi
            fi
            if [[ "$target" == "$host" ]]; then
              extra_ip="$(resolve_ipv4 "cloud-xent.crazzydns.com")"
              if [ -n "$extra_ip" ]; then
                echo "FTP_SERVER has no DNS record; using Hostinger server IP"
                target="$extra_ip"
              fi
            fi
            if [[ "$target" == "$host" ]] && ! [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "DNS lookup failed for FTP_SERVER (ENOTFOUND)."
              echo "Hostinger FTP host is the numeric IP in hPanel → Files → FTP Accounts."
              echo "ftp.yourdomain.in often has no DNS record — do not use it."
              echo "Set Production secret FTP_SERVER (or FTP_IP) to that IP, protocol ftps, port 21."
              exit 1
            fi
          fi

          echo "ftp_host=$target" >> "$GITHUB_OUTPUT"
          echo "ftp_port=$port" >> "$GITHUB_OUTPUT"
          echo "ftp_protocol=$FTP_PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "Protocol: $FTP_PROTOCOL  Port: $port"

      - name: Upload pack via explicit FTPS
        env:
          FTP_HOST: ${{ steps.ftp.outputs.ftp_host }}
          FTP_PORT: ${{ steps.ftp.outputs.ftp_port }}
          FTP_PROTOCOL: ${{ steps.ftp.outputs.ftp_protocol }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          LOCAL_DIR: ./deploy
          ARCHIVE_PATH: ./pack.tar.gz
        run: |
          set -euo pipefail
          if [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "Missing FTP_USERNAME or FTP_PASSWORD"
            exit 1
          fi
          python3 scripts/hostinger-ftp-deploy.py
