# Build Next.js on GitHub, then deploy the cPanel standalone pack to Hostinger via FTPS.
#
# FTP configuration (hPanel → Files → FTP Accounts):
#   FTP_SERVER       Host or IP from hPanel (e.g. ftp.srkcrackers.in)
#   FTP_USERNAME     FTP user, e.g. github@lively-orange-orangutan.srkcrackers.in
#   FTP_PASSWORD     FTP password
#   FTP_SERVER_DIR   Remote app folder, e.g. ./ (FTP account jailed to the app root)
#   Protocol:        ftps (explicit FTPS), Port: 21
#
# Secrets live on the GitHub "Production" environment
# (Settings → Environments → Production), never in this file.
#
# The build uses the project's own production pack script (npm run build:cpanel),
# which runs `prisma generate` + `next build` (output: "standalone") and copies
# static + public assets plus the cPanel runtime deps into .next/standalone.
#
# Only the generated production files are uploaded:
#   - server.js                 cPanel/Panel startup wrapper (repo root)
#   - package.json              so cPanel can detect the Node app
#   - .next/standalone/         the full standalone production pack
#   - tmp/restart.txt           triggers Passenger / Setup Node.js App reload
#
# Remote .env files and .htaccess are excluded from sync deletion so production
# secrets/config are never touched by a deploy.

name: Build and deploy to Hostinger FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build cPanel standalone pack
        env:
          NODE_ENV: production
          AUTH_TRUST_HOST: "true"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || vars.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || vars.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          if [ -z "$AUTH_SECRET" ] && [ -z "$NEXTAUTH_SECRET" ]; then
            export AUTH_SECRET="github-actions-build-placeholder"
            export NEXTAUTH_SECRET="$AUTH_SECRET"
            echo "AUTH_SECRET not set; using a build-only placeholder (set it in cPanel for runtime)."
          fi
          # Prisma generate needs a nonempty DATABASE_URL. GitHub empty secrets become ""
          # which fails validation — never export a blank URL.
          if [ -z "$DATABASE_URL" ]; then
            unset DATABASE_URL
            export DATABASE_URL="mysql://build:build@127.0.0.1:3306/build"
            echo "No DATABASE_URL; using a placeholder for Prisma generate/build."
            echo "Set MYSQL DATABASE_URL in cPanel for the live catalog."
          fi
          npm run build:cpanel

      - name: Stage production build files
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/.next deploy/tmp
          cp server.js deploy/server.js
          cp package.json deploy/package.json
          cp -a .next/standalone deploy/.next/standalone
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

          test -f deploy/server.js
          test -f deploy/.next/standalone/server.js
          echo "Staged:"
          du -sh deploy

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./deploy/
          protocol: ftps
          port: 21
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/.DS_Store
            .htaccess
          log-level: standard